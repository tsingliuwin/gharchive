name: GHArchive to Iceberg

on:
  schedule:
    # 04:00 UTC daily. GHArchive finishes the previous day's hourly files
    # shortly after midnight UTC, so by 04:00 all 24 are present.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD for one day, or YYYY-MM for a whole month. Empty = yesterday.'
        required: false
        default: ''

# A month input fans out to one parallel job per day; a single day or the
# daily cron runs exactly one job. Each job INSERTs 24 hourly batches into
# the Iceberg table on the R2 Data Catalog.
#
# max-parallel is 4 (not 8) to reduce concurrent commit conflicts on the
# shared Iceberg table. The script retries on commit failures with
# exponential backoff.
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.matrix.outputs.days }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          python3 -c "import os,json,gharchive_to_iceberg as m; print('days=' + json.dumps(m.resolve_dates(os.environ['DATE_INPUT'])))" >> "$GITHUB_OUTPUT"

  etl:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        day: ${{ fromJson(needs.prepare.outputs.days) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DuckDB
        run: pip install -r requirements.txt

      - name: Run Iceberg ETL for ${{ matrix.day }}
        env:
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ secrets.R2_WAREHOUSE }}
          R2_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
          DATE: ${{ matrix.day }}
        run: python gharchive_to_iceberg.py
