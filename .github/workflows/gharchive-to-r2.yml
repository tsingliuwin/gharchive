name: GHArchive to R2

on:
  schedule:
    # 04:00 UTC daily. GHArchive finishes the previous day's hourly files
    # shortly after midnight UTC, so by 04:00 all 24 are present.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD for one day, or YYYY-MM for a whole month. Empty = yesterday.'
        required: false
        default: ''

# A month input fans out to one parallel job per day; a single day or the daily
# cron runs exactly one job. Each job writes one Parquet to R2 at
# {year}/{month}/{date}.parquet.
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.matrix.outputs.days }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          python3 -c "import os,json,gharchive_to_r2 as m; print('days=' + json.dumps(m.resolve_dates(os.environ['DATE_INPUT'])))" >> "$GITHUB_OUTPUT"

  etl:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        day: ${{ fromJson(needs.prepare.outputs.days) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DuckDB
        run: pip install -r requirements.txt

      - name: Run ETL for ${{ matrix.day }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DATE: ${{ matrix.day }}
        run: python gharchive_to_r2.py
