name: GHArchive to R2

on:
  schedule:
    # 04:00 UTC daily. GHArchive finishes the previous day's hourly files
    # shortly after midnight UTC, so by 04:00 all 24 are present.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process as YYYY-MM-DD. Leave empty for yesterday.'
        required: false
        default: ''

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DuckDB
        run: pip install -r requirements.txt

      - name: Run ETL
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DATE: ${{ inputs.date }}
        run: python gharchive_to_r2.py
